name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint, tests, dbt build on fixtures, README check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools demo/backend
      - name: Fetch Power BI report schemas (Microsoft json-schemas, for validation)
        run: python tools/fetch_pbir_schemas.py data/cache/schemas
      - name: dbt build on fixtures
        env:
          SPA_WAREHOUSE: data/work/ci_warehouse.duckdb
          SPA_PSEUDONYM_SALT: fixture-salt
        run: |
          mkdir -p data/work
          dbt build --project-dir dbt --profiles-dir dbt --target ci --vars "{raw_path: 'tests/fixtures/raw'}"
      - name: Tests
        run: pytest -q
      - name: README tables and measure catalogue are current
        run: spa docs --check

  bpa:
    name: Power BI Best Practice Analyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Tabular Editor 2 (portable, open source)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/TabularEditor/TabularEditor/releases/download/2.29.0/TabularEditor.Portable.zip -OutFile te2.zip
          Expand-Archive te2.zip -DestinationPath te2
      - name: Run BPA on the TMDL model
        shell: pwsh
        run: |
          ./tools/powerbi/run_bpa.ps1 -TabularEditor te2/TabularEditor.exe -Out bpa.json
          $r = Get-Content bpa.json -Raw | ConvertFrom-Json
          if ($r.findings -gt 0) { $r.items | Format-Table | Out-String | Write-Output; exit 1 }

  demo:
    name: Demo build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build front end
        working-directory: demo/frontend
        run: |
          npm ci
          npm run build
      - name: Smoke test
        run: |
          pip install -r demo/requirements.txt
          python -m uvicorn demo.backend.app:app --port 8000 &
          sleep 3
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q "Shipping performance analytics"
          for f in meta fleet simulator ports analysis ai powerbi build coast; do curl -fsS -o /dev/null http://localhost:8000/data/$f.json; done
