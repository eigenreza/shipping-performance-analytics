[project]
name = "shipping-performance-analytics"
version = "1.0.0"
description = "Fuel, CO2, EU ETS cost and port time for vehicle carriers and ro-ro ships, modelled with dbt and Power BI."
authors = [{ name = "Reza Azad Gholami" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "dbt-core>=1.8,<1.11",
  "dbt-duckdb>=1.8",
  "polars>=1.0",
  "pyarrow>=15",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13",
  "deltalake>=0.18",
  "statsmodels>=0.14",
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlglot>=23",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "lxml", "pillow", "pypdf", "pathspec", "httpx", "httpx2"]

[project.scripts]
spa = "spa.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
